<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>員工服務</title><link rel="stylesheet" href="/assets/portal.css"><script type="module" src="/assets/portal.js"></script></head>
<body><header class="topbar"><a class="brand" href="/portal"><span class="brand-mark">E</span>員工服務</a><nav><a href="/about">關於</a><button id="logout" class="text-button" hidden>登出</button></nav></header>
<main class="portal-main">
  <section id="login-panel" class="login-panel"><div class="eyebrow">員工入口</div><h1>歡迎回來</h1><p class="muted">選擇帳號，使用 Passkey 登入。</p><form id="login-form"><fieldset class="account-picker"><legend class="sr-only">選擇帳號</legend><label><input type="radio" name="subject" value="alice" checked><span class="account"><span class="avatar alice">A</span><span><strong>Alice</strong><small>員工</small></span><span class="radio-dot"></span></span></label><label><input type="radio" name="subject" value="bob"><span class="account"><span class="avatar bob">B</span><span><strong>Bob</strong><small>人事管理</small></span><span class="radio-dot"></span></span></label></fieldset><button class="primary full" id="login" type="submit">使用 Passkey 登入 <span aria-hidden="true">→</span></button></form></section>
  <section id="workspace" hidden><div class="page-heading"><div><div id="greeting" class="eyebrow"></div><h1>你的工作空間</h1></div></div><div class="service-grid"><button class="service-card" data-resource="salary"><span class="service-icon salary-icon" aria-hidden="true">＄</span><h2>Salary</h2><p>薪資資料</p><span class="card-arrow" aria-hidden="true">↗</span></button><button class="service-card" data-resource="profile"><span class="service-icon profile-icon" aria-hidden="true">◎</span><h2>Profile</h2><p>員工資料</p><span class="card-arrow" aria-hidden="true">↗</span></button></div>
  <section id="resource-panel" class="resource-panel" hidden><div class="resource-heading"><h2 id="resource-title">Salary</h2><span id="result-status" role="status"></span></div><form id="access-form" class="access-form"><label for="owner">資料擁有者</label><div class="access-controls"><select id="owner"><option value="alice">Alice</option><option value="bob">Bob</option><option value="carol">Carol</option></select><button type="submit" class="primary" id="view">查看資料 <span aria-hidden="true">→</span></button></div></form><div id="result" aria-live="polite" hidden></div><div id="attempt" class="attempt" hidden></div></section></section>
  <details id="salary-editor" class="resource-panel" hidden><summary>修改薪資</summary><form id="salary-form" class="access-form salary-form"><label for="amount">新的薪資金額 · TWD</label><div class="access-controls"><input id="amount" name="amount" type="number" min="0" max="10000000" step="1" required><button type="submit" class="primary">驗證身分並儲存 <span aria-hidden="true">→</span></button></div></form></details>
  <div id="error" class="error" role="alert" hidden></div>
</main><footer>員工服務中心</footer></body></html>
