name: Verify ZTA Demo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and service integration tests
        run: python -m pytest -q
      - name: Generate local-only PKI
        run: python scripts/init.py
      - name: Compose configuration and Envoy validation
        run: |
          docker compose config --quiet
          docker compose run --rm --no-deps pep envoy --mode validate -c /etc/envoy/envoy.yaml
      - name: Start isolated stack
        run: |
          docker compose up --build -d --wait --wait-timeout 180
          python -c "import time,httpx; time.sleep(2); httpx.get('http://localhost:8080/health').raise_for_status()"
      - name: Real Envoy and mTLS scenarios
        run: python scripts/verify.py
      - name: Collect status
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: artifacts/*.json
          if-no-files-found: ignore
      - name: Clean up disposable CI stack
        if: always()
        run: docker compose down -v
