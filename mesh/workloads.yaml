apiVersion: v1
kind: Namespace
metadata:
  name: zta-207a
  labels:
    istio-injection: enabled
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: zta-207a
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: zta-207a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        sidecar.istio.io/inject: 'true'
        sidecar.istio.io/proxyCPU: 10m
        sidecar.istio.io/proxyMemory: 64Mi
        sidecar.istio.io/proxyMemoryLimit: 256Mi
    spec:
      serviceAccountName: frontend
      containers:
      - name: app
        image: zta-207a:local
        imagePullPolicy: IfNotPresent
        command:
        - uvicorn
        - app.mesh_frontend:app
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --no-access-log
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            cpu: 500m
            memory: 192Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: zta-207a
spec:
  selector:
    app: frontend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
