apiVersion: v1
kind: ServiceAccount
metadata:
  name: mesh-authz
  namespace: zta-207a
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mesh-authz
  namespace: zta-207a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-authz
  template:
    metadata:
      labels:
        app: mesh-authz
      annotations:
        sidecar.istio.io/inject: 'true'
        sidecar.istio.io/proxyCPU: 10m
        sidecar.istio.io/proxyMemory: 64Mi
        sidecar.istio.io/proxyMemoryLimit: 256Mi
    spec:
      serviceAccountName: mesh-authz
      containers:
      - name: app
        image: zta-207a:local
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - app.mesh_authz
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
          limits:
            cpu: 500m
            memory: 192Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: SERVICE_KEY
          valueFrom:
            secretKeyRef:
              name: mesh-control
              key: service-key
        ports:
        - containerPort: 9000
          name: grpc
        readinessProbe:
          tcpSocket:
            port: 9000
          periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mesh-authz
  namespace: zta-207a
spec:
  selector:
    app: mesh-authz
  ports:
  - name: grpc
    port: 9000
    targetPort: 9000
